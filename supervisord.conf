[supervisord]
nodaemon=true
user=root
logfile=/var/log/supervisor/supervisord.log
logfile_maxbytes=10MB
pidfile=/var/run/supervisord.pid
loglevel=info

[unix_http_server]
file=/var/run/supervisor.sock
chmod=0700

[rpcinterface:supervisor]
supervisor.rpcinterface_factory = supervisor.rpcinterface:make_main_rpcinterface

[supervisorctl]
serverurl=unix:///var/run/supervisor.sock

; ── 1. PostgreSQL (starts first) ───────────────────────────────
[program:postgresql]
command=/usr/lib/postgresql/15/bin/postgres
    -D /var/lib/postgresql/15/main
    -c config_file=/etc/postgresql/15/main/postgresql.conf
    -p 5434
user=postgres
autostart=true
autorestart=true
priority=10
startretries=5
startsecs=3
stdout_logfile=/var/log/supervisor/postgresql.log
stderr_logfile=/var/log/supervisor/postgresql.log
stdout_logfile_maxbytes=5MB

; ── 2. Node.js Backend (waits for postgres, then starts) ───────
[program:backend]
command=/bin/sh -c "until pg_isready -h 127.0.0.1 -p 5434 -U postgres -q; \
    do echo '[backend] Waiting for PostgreSQL...'; sleep 1; done; \
    exec node src/index.js"
directory=/app/backend
user=root
autostart=true
autorestart=true
priority=20
startretries=10
startsecs=5
stdout_logfile=/var/log/supervisor/backend.log
stderr_logfile=/var/log/supervisor/backend.log
stdout_logfile_maxbytes=5MB
environment=NODE_ENV="production",PORT="4001",DATABASE_URL="postgresql://postgres:@127.0.0.1:5434/gigopportunity?sslmode=disable"

; ── 3. Nginx — serves the React frontend + proxies /api/ ───────
[program:nginx]
command=/usr/sbin/nginx -g "daemon off;"
autostart=true
autorestart=true
priority=30
startretries=3
stdout_logfile=/var/log/supervisor/nginx.log
stderr_logfile=/var/log/supervisor/nginx.log
stdout_logfile_maxbytes=5MB
